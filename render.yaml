# Render.com blueprint: New > Blueprint, pick the jchadcole/snow-mock-ui repo.
services:
  - type: web
    name: snow-mock-ui
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # Default agency branding (see lib/brands.js). Switchable in Settings at runtime.
      - key: BRAND
        value: ohiotax
      - key: API_KEY
        generateValue: true
      # Who may iframe the app. "*" works with every Genesys Cloud region; tighten later if needed.
      # Saved taxpayers: on a paid plan, add a disk (mountPath /var/data) and set DATA_DIR=/var/data to keep them on the server.
      - key: FRAME_ANCESTORS
        value: "*"
